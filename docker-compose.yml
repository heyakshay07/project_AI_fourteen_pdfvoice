# docker compose up --build
# App: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdfvoice
      POSTGRES_PASSWORD: pdfvoice
      POSTGRES_DB: pdfvoice
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfvoice"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend: &backend
    build: ./backend
    environment: &backend-env
      APP_ENV: development            # set to "production" and provide a real SECRET_KEY when deploying
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-please-0123456789}
      DATABASE_URL: postgresql+psycopg://pdfvoice:pdfvoice@postgres:5432/pdfvoice
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: celery
      STORAGE_BACKEND: local
      STORAGE_DIR: /data/storage
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - storage:/data/storage
      - models:/models                # caches the Kokoro model download
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    <<: *backend
    command: celery -A app.tasks.processing_tasks:celery_app worker --loglevel=INFO --concurrency=2
    ports: []
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:
  storage:
  models:

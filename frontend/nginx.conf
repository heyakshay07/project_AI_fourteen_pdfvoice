server {
  listen 80;
  client_max_body_size 110m;          # keep >= MAX_UPLOAD_MB on the backend
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;          # first audio chunk can take a while on CPU
    proxy_buffering off;              # required for Server-Sent Events (progress stream)
  }

  location / {
    try_files $uri /index.html;       # single-page-app routing
  }
}
